[project]
name = "autosolar"
version = "0.1.0"
description = "AutoSolar Researcher: one question about a diesel island in, a checked solar and battery pre-feasibility study out"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pvlib>=0.11",
    "requests>=2.31",
    "jsonschema>=4.21",
    "meta-sam-parser>=0.1.0",
    "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autosolar"]
